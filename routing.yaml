# Deterministic routing table: (persona, intent) -> ordered list of skill names.
# This is the single source of truth for "what gets included" — reviewable
# in a PR like any other code change. No embeddings, no runtime LLM routing.
#
# Skill order here doesn't control render order — that's driven by each
# skill's `priority` field — but listing verification before the action
# it gates keeps this table readable as intent.

support_agent:
  refund_request: [account_verification, refund_processing]
  account_lookup: [account_verification]
  default: [general_help]

billing_agent:
  refund_request: [account_verification, refund_processing]
  invoice_dispute: [account_verification, refund_processing]
  default: [general_help]
