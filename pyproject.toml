[project]
name = "prompt-kit"
version = "0.1.0"
description = "File-based, deterministic prompt composition for agent harnesses."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
live = [
    "openai>=1.60",
]

[project.scripts]
prompt-kit = "prompt_kit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_kit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
